name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Runtime deps only. This package publishes with zero dependencies, so a consumer is
      # exposed to nothing an audit could find; the dev tree is jest's, and advisories inside
      # it have no clean upgrade (jest 29 pulls js-yaml, jest 30 pulls brace-expansion, and
      # `audit fix --force` proposes jest 25). Gating releases on that blocks every PR without
      # protecting anyone. Drop --omit=dev the moment this package takes a runtime dependency.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run spec-lint
